<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多学科学习助手</title>
    <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📚 多学科学习助手</h1>
            <p class="subtitle">基于 RAG 的智能学习平台</p>
        </header>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Left Sidebar -->
            <aside class="sidebar">
                <!-- API Key Section -->
                <div class="section">
                    <h3>🔑 API 密钥</h3>
                    <input type="password" id="apiKeyInput" placeholder="输入 DeepSeek API Key">
                    <button id="saveApiKeyBtn" class="btn btn-primary">保存密钥</button>
                    <div id="apiKeyStatus" class="status-text"></div>
                </div>

                <!-- Assistant Selector -->
                <div class="section" id="assistantSelectorSection" style="display: none;">
                    <h3>🎯 当前助手</h3>
                    <div id="currentAssistant" class="current-assistant"></div>
                    <button id="changeAssistantBtn" class="btn btn-secondary">切换助手</button>
                </div>

                <!-- File Upload -->
                <div class="section" id="uploadSection" style="display: none;">
                    <h3>📤 上传资料</h3>
                    <div class="upload-zone" id="uploadZone">
                        <input type="file" id="fileInput" accept=".cpp,.h,.txt,.md,.pdf,.docx,.py,.c,.hpp" multiple style="display: none;">
                        <p>点击选择文件或拖拽到此处</p>
                        <p class="upload-hint">支持多文件上传</p>
                    </div>
                    <button id="uploadBtn" class="btn btn-primary">上传文件</button>
                    <div id="uploadStatus" class="status-text"></div>
                    <div id="uploadProgress" class="upload-progress" style="display: none;"></div>
                </div>

                <!-- File List -->
                <div class="section" id="fileListSection" style="display: none;">
                    <h3>📁 已上传文件</h3>
                    <div id="fileList" class="file-list"></div>
                </div>

                <!-- Knowledge Base Stats -->
                <div class="section" id="statsSection" style="display: none;">
                    <h3>📊 知识库统计</h3>
                    <div id="kbStats" class="stats-display"></div>
                    <button id="refreshStatsBtn" class="btn btn-secondary">刷新</button>
                </div>

                <!-- Actions -->
                <div class="section" id="actionsSection" style="display: none;">
                    <h3>⚙️ 操作</h3>
                    <button id="clearHistoryBtn" class="btn btn-warning">清空对话</button>
                    <button id="clearKbBtn" class="btn btn-danger">清空知识库</button>
                    <button id="generateQuizBtn" class="btn btn-success">生成测验</button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="content">
                <!-- Assistant Selection View -->
                <div id="assistantSelectionView" class="view active">
                    <div class="view-header">
                        <h2>选择学习助手</h2>
                        <button id="createAssistantBtn" class="btn-icon" title="创建新助手">+</button>
                    </div>
                    <div id="assistantCards" class="assistant-cards"></div>
                </div>

                <!-- Chat View -->
                <div id="chatView" class="view">
                    <div class="chat-layout">
                        <aside class="session-sidebar">
                            <div class="session-sidebar-header">
                                <span>对话</span>
                                <button id="newSessionBtn" class="btn-icon-sm" title="新建对话">+</button>
                            </div>
                            <div id="sessionList" class="session-list"></div>
                        </aside>
                        <div class="chat-main">
                            <div class="chat-toolbar">
                                <span id="currentSessionTitle" class="current-session-title">新对话</span>
                                <div class="chat-toolbar-actions">
                                    <button id="memoryBtn" class="btn btn-secondary btn-sm" title="编辑长期备忘">📝 备忘</button>
                                    <button id="exportSessionBtn" class="btn btn-secondary btn-sm" title="导出当前对话">⬇ 导出</button>
                                </div>
                            </div>
                            <div id="chatMessages" class="chat-messages"></div>
                            <div class="chat-input-container">
                                <textarea id="chatInput" placeholder="输入你的问题..." rows="3"></textarea>
                                <button id="sendBtn" class="btn btn-primary">发送</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quiz View -->
                <div id="quizView" class="view">
                    <div id="quizContainer"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Create Assistant Modal -->
    <div id="createAssistantModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3>创建新助手</h3>
            <label class="modal-label">名称</label>
            <input type="text" id="newAssistantName" placeholder="例如：高等数学" maxlength="30">
            <label class="modal-label">描述</label>
            <textarea id="newAssistantDesc" placeholder="简要描述该助手的教学范围和定位" rows="3" maxlength="200"></textarea>
            <div class="modal-actions">
                <button id="cancelCreateBtn" class="btn btn-secondary">取消</button>
                <button id="confirmCreateBtn" class="btn btn-primary">创建</button>
            </div>
        </div>
    </div>

    <!-- Quiz Options Modal -->
    <div id="quizOptionsModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3>生成测验</h3>
            <label class="modal-label" for="quizOptCount">题目数量 (1-30)</label>
            <input type="number" id="quizOptCount" min="1" max="30" value="5">
            <label class="modal-label" for="quizOptDifficulty">难度</label>
            <select id="quizOptDifficulty">
                <option value="easy">简单</option>
                <option value="medium" selected>中等</option>
                <option value="hard">困难</option>
            </select>
            <label class="modal-label" for="quizOptType">题型</label>
            <select id="quizOptType">
                <option value="mixed" selected>混合</option>
                <option value="single_choice">单选</option>
                <option value="short_answer">简答</option>
                <option value="code_reading">代码阅读</option>
                <option value="proof">证明</option>
            </select>
            <label class="modal-label" for="quizOptTopic">主题（可选）</label>
            <input type="text" id="quizOptTopic" placeholder="留空则使用当前助手主题" maxlength="100">
            <div class="modal-actions">
                <button id="cancelQuizOptBtn" class="btn btn-secondary">取消</button>
                <button id="confirmQuizOptBtn" class="btn btn-primary">开始生成</button>
            </div>
        </div>
    </div>

    <!-- Memory Note Modal -->
    <div id="memoryModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3>📝 长期备忘</h3>
            <p class="modal-hint">这段文字会附加到系统提示中，让助手记住关于你的长期偏好（如学习目标、知识背景、答题风格要求）。</p>
            <textarea id="memoryNoteInput" placeholder="例如：我正在准备 408 考研，C++ 基础一般，回答时多用类比，代码请详细注释。" rows="6" maxlength="4000"></textarea>
            <div class="modal-actions">
                <button id="cancelMemoryBtn" class="btn btn-secondary">取消</button>
                <button id="saveMemoryBtn" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js?v=4"></script>
    <script src="js/chat.js?v=4"></script>
    <script src="js/quiz.js?v=5"></script>
    <script src="js/upload.js?v=4"></script>
    <script src="js/app.js?v=4"></script>
</body>
</html>
